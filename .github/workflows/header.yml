name: header

on:
  schedule:
    # GitHub runs this every few hours at best, whatever the cron says
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/header.py, .github/workflows/header.yml]

permissions:
  contents: write

concurrency:
  group: header
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - run: python3 tools/header.py dist

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Update header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
